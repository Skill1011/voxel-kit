<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel-Figur</title>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Skill1011/voxel-kit@v2.1.0/voxel_kit.js"></script>
<script>
// Example (the quality bar): "Zombie-Feuerwehrmann". Built from the body() base (the reference proportions), head() with lit
// front planes, then clothes as SHAPED pieces (front panels, V lapels, collar ring, hem flaps, reflective bands), wounds,
// one prop and a pose preset. This is the pattern for every humanoid.
function buildFigure(VoxelKit) {
	const fig = new VoxelKit.Figure('ZombieFeuerwehr', { seed: 31, jitter: 9 });
	const ramp = VoxelKit.ramp;
	const skin = ['#91a467', '#708b53', '#546c41', '#35492b'];     // zombie green: hi, mid, lo, deep
	const coat = ramp('#a07a43', 0.8);                              // tan turnout coat
	const refl = ['#f2c21b', '#d6d8d2'];                            // yellow + silver reflective tape
	const dark = ['#2a2626', '#211e1f', '#363031'];
	const red = ramp('#b3262f');
	const ember = VoxelKit.neonRamp('#ff7a1a');                     // one neon family: embers
	const burn = '#2b2320';
	const B = (part, p, s, c, o) => fig.box(part, p, s, c, Object.assign({ jitter: 0 }, o || {}));

	// 1. base body: coat on top (rolled sleeves show the forearms), torn trousers, boots with a yellow band
	const b = fig.body({ skin, top: coat, pants: coat, boots: ['#2a2523', '#2a2523', '#231f1e', '#1a1716'], bootBand: refl[0],
		belt: dark[0], buckle: '#8a8f96', hands: { curl: 0.55, claws: true } });
	const fz = b.torsoFront, z0 = b.z0;

	// 2. clothes as shaped pieces
	B('Torso', [0, 1.75, z0 - 1.05], [1.5, 3.2, 0.5], dark[0]);                       // dark shirt in the open front
	for (const s of [1, -1]) {
		B('Torso', [s * 0.98, 2.45, fz - 0.05], [0.62, 2.0, 0.3], coat[2], { rot: [0, 0, s * 24] });   // lapels in a V
		fig.band('Torso', [s * 1.45, 0.85, fz], 1.35, refl);
		fig.band('Torso', [s * 1.45, 2.05, fz], 1.35, refl);
		fig.band('Torso', [s * 2.255, 0.85, z0], 2.3, refl, { face: s > 0 ? '+X' : '-X' });
		for (const y of [0.45, 1.45, 2.65]) B('Torso', [s * 0.82, y, fz - 0.05], [0.28, 0.16, 0.1], dark[1]);   // clasps
		fig.band('Fore' + (s > 0 ? 'R' : 'L'), [s * 0.15, -0.95, -0.9], 1.76, refl);
		fig.band('Shin' + (s > 0 ? 'R' : 'L'), [s * 0.05, -0.55, z0 - 0.93], 1.86, refl);
	}
	fig.collar('Torso', [0, 3.75, z0 - 0.15], [1.35, 1.0], 11, [coat[1], coat[2]], { size: [0.78, 0.7, 0.7], jitter: 10 });
	fig.fringe('Torso', [-2.0, 0.05, fz + 0.1], [2.0, 0.05, fz + 0.1], 9, [0.7, 1.0], [coat[1], coat[2]], { thick: 0.36 });   // coat hem
	// air tank on the back with straps, radio pouch on the hip
	B('Torso', [0, 1.9, z0 + 1.55], [1.15, 3.0, 1.15], '#b8bdc4', { mat: 'Metal' });
	B('Torso', [0, 3.55, z0 + 1.55], [0.5, 0.35, 0.5], '#2b2b2b');
	for (const s of [1, -1]) B('Torso', [s * 0.95, 1.9, z0 + 1.28], [0.28, 3.6, 0.12], dark[0]);
	B('Pelvis', [-1.6, -0.35, z0 - 0.4], [0.7, 0.9, 0.9], dark[2]);

	// 3. wounds and embers (the zombie part): burn marks, glowing cracks
	for (const [x, y] of [[-1.2, 2.9], [1.5, 1.2], [-0.95, 0.4], [1.2, 3.1]]) fig.box('Torso', [x, y, fz - 0.03], [0.42, 0.34, 0.06], burn, { jitter: 20, tiltAxis: 2 });
	fig.crack('Torso', [1.75, 3.0, fz - 0.04], [1.05, 1.55, fz - 0.04], ember, { normal: [0, 0, -1] });
	fig.crack('ShinR', [0.25, -2.25, z0 - 0.87], [-0.15, -2.9, z0 - 0.87], ember, { normal: [0, 0, -1], segments: 3 });

	// 4. head: modelled face with ember eyes, stitched scar, burnt cheek; firefighter helmet on its own joint
	const h = fig.head('Head', { skin, eyes: ember[0], expression: 'angry', gap: 4 });
	for (let i = 0; i < 6; i++) fig.box('Head', [-1.05 + i * 0.2, h.center[1] + 1.05 - i * 0.05, h.front - 0.14], [0.17, 0.14, 0.06], i % 2 ? '#42181c' : '#6c352f', { jitter: 30, tiltAxis: 2 });
	fig.texture('Head', [1.15, h.center[1] - 0.5, h.front - 0.24], [0.5, 0.45], [burn, '#3a2c24'], { face: '-Z', count: 3, tile: [0.14, 0.26] });
	B('Jaw', [0, -0.57, -0.4], [2.66, 0.56, 0.97], skin[1]);
	fig.addPart('Helmet', [0, 16.15, z0 + 0.1], 'Head', { sway: false });
	B('Helmet', [0, 0.55, 0], [3.75, 1.3, 2.9], red[1]);
	B('Helmet', [0, 1.3, 0], [3.0, 0.45, 2.3], red[0]);
	B('Helmet', [0, 1.6, 0.1], [0.55, 0.45, 2.7], red[2]);
	B('Helmet', [0, -0.08, 0.5], [4.1, 0.24, 4.0], red[2], { rot: [-6, 0, 0] });
	B('Helmet', [0, 0.65, -1.52], [1.1, 1.15, 0.16], '#d9c06a');
	fig.emblem('Helmet', [0, 0.65, -1.62], ['.k.', 'kkk', '.k.'], { k: '#7a1d1d' }, { pixel: 0.2 });

	// 5. prop: a fire axe in the right hand, built hanging down
	fig.addPart('Axe', [2.6, 5.9, -0.5], 'HandR', { sway: false });
	B('Axe', [0, -1.3, 0], [0.34, 3.8, 0.34], '#6b4a2c');
	B('Axe', [0, -3.0, -0.7], [0.3, 1.3, 1.6], '#c22a2a');
	B('Axe', [0, -3.0, -1.6], [0.22, 1.5, 0.35], '#c9ced4', { mat: 'Metal' });
	B('Axe', [0, -3.0, 0.55], [0.3, 0.45, 1.0], '#c22a2a');

	// 6. pose last
	fig.posePreset('zombie');
	return fig.prune();
}

</script>
<script src="https://cdn.jsdelivr.net/gh/Skill1011/voxel-kit@v2.1.0/viewer.js"></script>
</body>
</html>
